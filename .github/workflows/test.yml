name: test
on: [push, pull_request]
jobs:
  runner:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in runner/*.mjs ledger.mjs cost.mjs; do node --check "$f"; done
      - run: node runner/test-run-card.mjs
